# Example settings for extracting Moodle data from MySQL.
#
# Moodle table names below use the default physical table prefix `mdl_`.
# If your Moodle site uses a different `$CFG->prefix`, update every table name
# accordingly before running extract-and-load.
#
# The core table selection is based on the local_panorama Moodle plugin export
# list in ../moodle_panorama/classes/athena_initializer.php, with additional
# common activity and event tables for learning analytics.
datalake:
  type: aws
  panorama_raw_data_bucket: panorama
  base_prefix: moodle
  aws_access_key:
  aws_secret_access_key:
  aws_region: us-east-1
  datalake_database: panorama
  datalake_workgroup: panorama
  base_partitions:
  - name: lms
    type: varchar
    value: moodle.example.com
datasources:
- type: mysql
  name: moodle_mysql
  mysql_username:
  mysql_password:
  mysql_host:
  mysql_port: 3306
  mysql_database: moodle
  tables:
  - name: mdl_config
    datalake_s3_table: config
    fields:
    - name: id
      type: bigint
    - name: name
      type: varchar
    - name: value
      type: longtext
  - name: mdl_context
    datalake_s3_table: context
    fields:
